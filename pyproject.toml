[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajstats"
version = "0.1.0"
description = "Statistical analysis and visualization of pedestrian and vehicle trajectories from traffic-intersection datasets (SinD and others)."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "requests>=2.31",
]

[project.scripts]
trajstats = "trajstats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
